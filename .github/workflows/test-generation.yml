name: Test Generation

on:
  schedule:
    # Weekdays at 06:00 UTC
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    environment: dev1
    timeout-minutes: 120
    env:
      DIDAXIS_URL: ${{ secrets.DIDAXIS_URL }}
      DIDAXIS_EMAIL: ${{ secrets.DIDAXIS_EMAIL }}
      DIDAXIS_PASSWORD: ${{ secrets.DIDAXIS_PASSWORD }}
      DIDAXIS_API_TOKEN: ${{ secrets.DIDAXIS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Playwright suite
        id: playwright
        continue-on-error: true
        run: npx playwright test

      - name: Self-heal on red and open repair PR
        if: steps.playwright.outcome == 'failure'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          agent -p --force --trust --output-format text "$(cat <<EOF
          The Playwright suite is red on the default branch checkout. This step runs even when the Jira backlog queue is empty — suite maintenance does not depend on tickets.

          Failing workflow run: $GITHUB_RUN_URL
          Use playwright-report/ and test-results/ in the repo (from the step above) plus gh run view when you need CI context.

          Follow Heal on red in .cursor/rules/qa-orchestration.mdc:

          1. Triage — apply .cursor/skills/ci-failure-triage/SKILL.md and classify each failure (real app bug vs test issue / drift).
          2. For each failure classified as drift (cap at 5 heals this run): apply .cursor/skills/self-heal/SKILL.md — patch pages/ POM locators only, never change spec assertions, re-run the failing spec until green with assertions unchanged.
          3. Open one repair pull request for the heal(s) using gh pr create. Title it like "fix(test): self-heal locator drift" and link $GITHUB_RUN_URL in the body. Summarize old → new locator diffs and green re-run evidence. Do not merge.
          4. If triage says real app bug, stop healing and summarize for human review — do not open a heal PR and do not file Jira without approval.
          5. If a heal cannot prove green without changing assertions, stop and escalate in the PR description or job summary — do not weaken tests.

          Push the repair branch and create the PR before finishing.
          EOF
          )"

      - name: Work In Progress backlog
        continue-on-error: true
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          agent -p --force --trust --output-format text "$(cat <<'EOF'
          Work the In Progress backlog in backlog mode (see .cursor/rules/qa-orchestration.mdc).

          Queue: DS tickets in status "In Progress" that do not already have the tests-generated label. Cap at 5 tickets per run.

          If the queue is empty, exit successfully immediately after a one-line summary. Do not skip or block suite self-heal — an earlier workflow step already ran the full Playwright suite and opened a repair PR when the suite was red.

          Per ticket: analyze → write a conforming Playwright spec under tests/ (and pages/fixtures as needed) → run npx playwright test → on red, triage first (see Heal on red below). Open one PR per ticket linked to the Jira ticket, then add the tests-generated label so the next run skips it.

          Heal on red (per ticket only — suite-wide heal already ran before this step):
          1. Triage first — apply .cursor/skills/ci-failure-triage/SKILL.md. Do not heal, rewrite assertions, or file a bug until triage classifies the failure.
          2. Drift (test issue) — apply .cursor/skills/self-heal/SKILL.md: re-discover via Playwright MCP (role + accessible name), patch pages/ POM locators only, re-run the failing spec with assertions unchanged, then open a repair PR linked to the failing run. At most one locator repair per heal pass; at most 5 heals per workflow run.
          3. Real app bug — route to bug-reporter; never heal. Do not file a bug without human approval.
          4. Never merge any PR without human approval.

          On a repeated identical failure, stop that ticket and move on. Never merge, never close a ticket, never file a bug without human approval.
          EOF
          )"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
